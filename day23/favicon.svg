<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Recessed dial: darker at the top left, where the panel edge casts its shadow -->
    <radialGradient id="dial" cx="62%" cy="64%" r="70%">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="0.62" stop-color="#eeebe5"/>
      <stop offset="1" stop-color="#cfcac1"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfcfa"/>
      <stop offset="1" stop-color="#e9e6e0"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- White panel -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#panel)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#000" stroke-opacity="0.08"/>

  <!-- Dial -->
  <circle cx="32" cy="32" r="24" fill="url(#dial)"/>

  <!-- Hands at ten past ten: hour hand towards 10, minute hand towards 2 -->
  <g id="hands" fill="none" stroke-linecap="round" stroke-width="5.5">
    <!-- Soft shadow, cast down and to the right -->
    <path d="M32 33 L20.7 26.5 M32 33 L47.6 24" stroke="#5a544a" stroke-opacity="0.35"
          transform="translate(2.2 2.8)" filter="url(#soft)"/>
    <path d="M32 33 L20.7 26.5 M32 33 L47.6 24" stroke="#111"/>
  </g>
</svg>
