<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pretty Normal Text Adventure</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23020a04'/%3E%3Cpath d='M3 4l4 4-4 4' stroke='%2339ff7a' stroke-width='2' fill='none'/%3E%3Crect x='8' y='11' width='5' height='2' fill='%2339ff7a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="title" class="screen">
  <img src="img/title.png" alt="Pretty Normal Text Adventure">
  <p class="press blink">PRESS ANY KEY TO BEGIN</p>
  <p class="sub" id="loadhint" hidden>Press L to continue your saved game</p>
  <p class="sub dim">A week in the life of a pretty normal man. No dragons were harmed.</p>
</div>

<div id="game" class="screen" hidden>
  <div id="top">
    <pre id="art"></pre>
    <div id="status"></div>
  </div>
  <div id="out">
    <div id="prompt"><span class="gt">&gt;&nbsp;</span><span id="typed"></span><span class="cur">&#9608;</span>
      <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command">
    </div>
  </div>
</div>
<div id="map" class="screen" hidden>
  <div class="maphead"><span>CITY MAP</span><span id="mapinfo"></span></div>
  <pre id="mappre"></pre>
  <div id="maplegend"></div>
  <div class="mapfoot blink">PRESS ANY KEY OR TAP TO CLOSE</div>
</div>
<div class="crt" aria-hidden="true"></div>

<script src="js/art.js"></script>
<script src="js/world.js"></script>
<script src="js/npcs.js"></script>
<script src="js/minigame.js"></script>
<script src="js/week.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
