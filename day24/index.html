<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find the *</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Find the <em>*</em></h1>
      <p class="sub">Watch the Joker, follow the shuffle, pick the right card.</p>
    </header>

    <section class="hud" aria-label="Game status">
      <div class="stat"><span class="label">Bank</span><span class="value" id="bank">$100</span></div>
      <div class="stat"><span class="label">Round</span><span class="value" id="round">1</span></div>
      <div class="stat"><span class="label">Speed</span><span class="value" id="speed">×1.00</span></div>
      <div class="stat"><span class="label">Best</span><span class="value" id="best">$100</span></div>
    </section>

    <section class="table" id="table" aria-label="Card table">
      <p class="message" id="message" aria-live="polite">Place your bet and deal.</p>
      <div class="aids" id="aids" aria-label="Helpers"></div>
    </section>

    <section class="controls">
      <div class="group">
        <span class="label">Difficulty</span>
        <div class="seg" id="levels"></div>
      </div>
      <div class="group">
        <span class="label">Bet <b id="betValue">$10</b></span>
        <div class="chips" id="chips"></div>
      </div>
      <div class="actions">
        <button class="cashout" id="cashout" type="button" title="End this run and put it on the records board">Cash out</button>
        <button class="deal" id="deal" type="button">Deal</button>
      </div>
    </section>

    <footer class="foot">
      <span class="keys">Keys: <kbd>Space</kbd> deal · <kbd>1</kbd>–<kbd>4</kbd> pick · <kbd>M</kbd> sound · <kbd>N</kbd> music · <kbd>T</kbd> timer</span>
      <span class="toggles">
        <button class="mute" id="saloon" type="button" aria-label="Tables, medals and records">Tables &amp; records</button>
        <button class="mute" id="timer" type="button" aria-label="Toggle the pick time limit">Timer on</button>
        <button class="mute" id="music" type="button" aria-label="Toggle music">Music on</button>
        <button class="mute" id="mute" type="button" aria-label="Toggle sound effects">Sound on</button>
      </span>
    </footer>
  </main>

  <div class="overlay" id="over" hidden>
    <div class="panel">
      <h2 id="overTitle">Busted!</h2>
      <p id="overText"></p>
      <p class="rank" id="overRank"></p>
      <button class="deal" id="again" type="button">Play again</button>
    </div>
  </div>

  <script src="js/sound.js"></script>
  <script src="js/music.js"></script>
  <script src="js/medals.js"></script>
  <script src="js/saloon.js"></script>
  <script src="js/beats.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/dealer.js"></script>
  <script src="js/events.js"></script>
  <script src="js/season.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
